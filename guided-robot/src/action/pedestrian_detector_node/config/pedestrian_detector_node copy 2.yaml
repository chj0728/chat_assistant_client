pedestrian_detector_node:
  ros__parameters:
    attraction_distance: 1.5 # 招揽距离(米)
    enable_pedestrian_detection: false  # 是否开启行人检测 -- 其实是否开启主动唤醒
    enable_vip_recognition: false  # 是否开启VIP识别
    face_database_path: "/home/ymrobot/ros2_ws_guidance/src/guided-robot/assets/face/face_data"  # 人脸数据库路径
    welcome_message: "欢迎光临"  # 默认欢迎语
    detection_frequency: 1.0  # 检测频率(Hz)
    detection_confidence: 0.7  # 检测置信度阈值
    vip_recognition_threshold: 0.6  # VIP识别相似度阈值
    prototxt_file_adress: "/home/ymrobot/ros2_ws_guidance/src/guided-robot/assets/deploy.prototxt"
    caffemodel_file_adress: "/home/ymrobot/ros2_ws_guidance/src/guided-robot/assets/res10_300x300_ssd_iter_140000.caffemodel"