controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      #footprint: '[[0.399588, 0.35], [0.511588, 0.238],[0.511588, -0.238],[0.399588, -0.35],[-0.399588, -0.35],[-0.511588, -0.238],[-0.511588, 0.238],[-0.399588, 0.35]]'
      robot_radius: 0.35
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 3.0
        inflate_around_unknown: true
        inflation_radius: 0.5
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: pointcloud
        plugin: nav2_costmap_2d::ObstacleLayer
        pointcloud:
          clearing: true
          data_type: "PointCloud2"
          marking: true
          min_obstacle_height: -0.05
          max_obstacle_height: 1.5
          raytrace_max_range: 5.0
          raytrace_min_range: 0.05
          obstacle_max_range: 5.0
          obstacle_min_range: 0.6
          topic: /livox/lidar_cloud2
      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_link
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      update_frequency: 1.0
      use_sim_time: false
  global_costmap_client:
    ros__parameters:
      use_sim_time: false
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false


local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      #footprint: '[[0.399588, 0.35], [0.511588, 0.238],[0.511588, -0.238],[0.399588, -0.35],[-0.399588, -0.35],[-0.511588, -0.238],[-0.511588, 0.238],[-0.399588, 0.35]]'
      robot_radius: 0.3
      global_frame: map
      height: 3
      width: 3
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
        plugin: nav2_costmap_2d::InflationLayer
      plugins:
        - obstacle_layer
        - inflation_layer
        - voxel_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_link
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: true
      update_frequency: 5.0
      use_sim_time: false
      obstacle_layer:
        enabled: true
        observation_sources: pointcloud
        plugin: nav2_costmap_2d::ObstacleLayer
        pointcloud:
          clearing: true
          data_type: "PointCloud2"
          marking: true
          min_obstacle_height: -0.05
          max_obstacle_height: 1.5
          raytrace_max_range: 5.0
          raytrace_min_range: 0.05
          obstacle_max_range: 5.0
          obstacle_min_range: 0.6
          topic: /livox/lidar_cloud2
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 1.5
        mark_threshold: 0  #16个格子 只要有一个格子有障碍物就表示有障碍物
        observation_sources: pointcloud
        pointcloud:
          topic: /livox/lidar_cloud2
          max_obstacle_height: 1.5
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.6
    ros__parameters:
      use_sim_time: false
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
    expected_planner_frequency: 20.0
    planner_plugins:
      - GridBased
    use_sim_time: false
    
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

smoother_server:
  ros__parameters:
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
    smoother_plugins:
      - simple_smoother
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    use_sim_time: false
    wait_at_waypoint:
      enabled: true
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      waypoint_pause_duration: 200
    waypoint_task_executor_plugin: wait_at_waypoint

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.33, 0.0, 2.0]
    min_velocity: [-0.05, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/fastlio2/lio_odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
