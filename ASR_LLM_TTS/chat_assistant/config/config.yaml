##################### ASR 配置 ######################
asr_enable: true # 是否启动激活 ASR 模块
asr_server: ['asr_local'] # 可选值: "asr_local"（本地 jestson orin 设备提供的 ASR 服务） "asr_remote"（远程服务器提供的 ASR 服务 ）
asr_local:
  host: "192.168.10.101" # 本地 ASR 服务器地址，通常是 Jetson Orin 设备的 IP 地址
  port: 6006 # 2002（FunASR 服务端 HTTP 模式）或 6006（sherpa_onnx_asr 服务端 HTTP/WebSocket 模式）
  use_websocket: true # 是否使用 WebSocket ，确保服务端支持 WebSocket
  timeout_sec: 3 # ASR 请求超时时间，单位秒，根据实际情况调整
asr_remote:
  host: "192.168.50.220" # 远程 ASR 服务器地址
  port: 2002
#####################################################

###################### LLM 配置 ######################
llm_enable: true # 是否启动激活 LLM 模块
llm_stream_infer_enable: true # 是否启用 LLM 流式推理，开启后可以配合 tts_stream_infer 实现边说边播效果
llm:
  host: "192.168.50.125" # 局域网内 LLM 服务器地址
  port: 8000 # 局域网内 LLM 服务器端口
  enable_cloud: true # 是否启用云端 LLM 服务，启用后会使用云端 API 进行推理，确保.env 中的 EAS_TOKEN 和 EAS_ENDPOINT 已正确配置
  timeout_sec: 5
  temperature: 0.6 # 生成文本的随机程度，范围0-1，值越大越随机
  # （max_tokens + max_completion_tokens(限制模型回复tokens) +RAG 检索结果 tokens) 需要在模型的上下文窗口限制内，例如 2048 或 4096，具体取决于所使用的 LLM 模型
  max_tokens: 150 # 历史消息的最大 token 数量，配合 max_messages 控制上下文长度，根据实际情况调整
  max_messages: 15 # 历史消息的最大条数，配合 max_tokens 控制上下文长度，根据实际情况调整
  max_completion_tokens: 100 # 只限制 生成内容（completion） 的 token 数量，不是输入（prompt）+输出（completion）的总token数，根据实际情况调整

  enable_thinking: false # 是否启用思考过程
  rag_enable: true # 是否启用 RAG 功能，启用后会在 LLM 回复前先进行检索增强
  default_system_prompt: |
    你需要简洁且有礼貌地回答用户的问题，请保持回答简短且有条理。
    正文中请正常使用中文标点符号来表达停顿和语义边界，便于流式切分和语音合成。
    如果你不确定答案，可以礼貌地告诉用户你不知道。
    只有当用户回答退出、结束等相关内容时，调用结束对话的工具函数，礼貌地结束对话。
    同时你要根据根据用户的输入，判断用户想要进入哪个状态，并在回答开头附加状态标签，格式为：<INTENT>状态</INTENT>
    可用的状态及示例：
    - NEEDS_GUIDANCE：需要参观（例如：“参观一下”、“带我看看”、“带我逛逛”、“想看看”）
    - MOVE_TO_WAIT：退下/不用了（例如：“退一下”、“不用了”、“退下”、“回去吧”、“回去充电吧”）
    - WAIT_FOR_TALK：等待对话（默认状态，用于普通对话或不确定的情况）
    - INTERRUPT：中断对话（例如：“好了好了”、“我打断你一下”、“先停一下”）
    示例：{
          "instruction": "能带我参观一下智己汽车店吗？",
          "input": "",
          "output": "<INTENT>NEEDS_GUIDANCE</INTENT>好的，请跟我这边走",
          "system": ""
         },
         {
          "instruction": "你能给我介绍一下智己ls6么？",
          "input": "",
          "output": "<INTENT>WAIT_FOR_TALK</INTENT>......",
          "system": ""
         },
         {
          "instruction": "你退下回去充电吧",
          "input": "",
          "output": "<INTENT>MOVE_TO_WAIT</INTENT>好的，我先退下了",
          "system": ""
         }
    如果不确定用户意图，则输出 WAIT_FOR_TALK 状态
    回答应简洁、可追溯，控制在100字以内，并严格以状态标签开头（标签前不要添加其他内容）

#####################################################

###################### TTS 配置 ######################
tts_enable: false # 是否启动激活 TTS 模块
TTS:
  tts_server_type: "tts_remote" # 默认使用本地 TTS 服务器 ，如果需要切换到远程服务器，修改为 tts_remote
  timeout_sec: 5 # TTS 请求超时时间，单位秒，根据实际情况调整
  playback_start_delay_sec: 0.5 # 起播确认延迟时间，单位秒，根据实际情况调整，影响 tts_active_topic 发布时机

  # 音频播放参数
  channels: 1 # 单声道
  chunk_size: 2048 # 每次读取的音频块大小（帧数）
  buffer_size: 4096 # 音频缓冲区大小（帧数）
  sample_rate: 24000 # 采样率（Hz），需要与 TTS 服务器的输出采样率一致，确保音频播放正常

  # ----------- tts_local (sherpa_onnx_tts 本地 TTS 服务) -----------
  host: "192.168.10.101" # 本地 TTS 服务器地址，通常是 Jetson Orin 设备的 IP 地址
  port: 50000
  # {speaker_id:0} {sample_rate:16000} {speed:1.0}(https://k2-fsa.github.io/sherpa/onnx/tts/all/Chinese-English/matcha-icefall-zh-en.html)
  # {speaker_id:1,3,4} {sample_rate:16000} {speed:0.7}(https://k2-fsa.github.io/sherpa/onnx/tts/pretrained_models/vits.html#csukuangfj-sherpa-onnx-vits-zh-ll-chinese-5-speakers)
  # {speaker_id: 62, 69, 95,96} {sample_rate:24000} {speed:1.0}(https://k2-fsa.github.io/sherpa/onnx/tts/pretrained_models/kokoro.html#kokoro-multi-lang-v1-1-chinese-english-103-speakers)
  # {speaker_id: 50} {sample_rate:24000} {speed:1.0}(https://k2-fsa.github.io/sherpa/onnx/tts/pretrained_models/kokoro.html#kokoro-multi-lang-v1-0-chinese-english-53-speakers)
  speaker_id: 4
  speed: 1
  use_websocket: true # 是否使用 WebSocket 连接 TTS 服务器，确保服务器支持 WebSocket
  ws_path: "/ws/api/tts" # WebSocket 连接路径，确保服务器的 WebSocket 服务监听在此路径
  # ----------------------------------------------------------------

  # ----------- tts_remote (阿里云 TTS 服务) -----------
  ## https://help.aliyun.com/zh/model-studio/qwen-tts-voice-list?spm=a2c4g.11186623.0.0.4b081457cdvDn3#0ad0bfdd635ar
  voice_type: "Ethan" # Ethan(标准普通话，带部分北方口音。阳光、温暖、活力、朝气（男性）)  # Cherry(阳光积极、亲切自然小姐姐（女性）) 
  model: "qwen3-tts-flash-realtime" # 阿里云 TTS 模型名称，具体可参考阿里云官方文档，根据需要选择合适的模型

  ## server_commit(由服务端智能处理文本分段与合成时机，适合大段文本的连续合成场景。客户端只需持续追加文本，无需关注分段和提交。)
  ## commit(由客户端主动提交文本缓冲区以触发合成，适合需要精确控制合成时机的场景（如对话式 AI 逐轮合成）。)
  remote_mode: "commit" 
  remote_url: 'wss://dashscope.aliyuncs.com/api-ws/v1/realtime'
  # ---------------------------------------------------

# tts_remote:
#   host: "192.168.50.220" # 远程 TTS 服务器地址
#   port: 50000
#   voice_type: "longshu_zh" # 可选值: "default"(女性活泼), "zh"(男性非标准) , "hard_zh"(男性业余), "longshu_zh"(男性专业), "longwan_zh"（女性专业）

################# 音频采集参数 #################
Audio:
  rate: 16000 # 8000 ，16000， 32000， 48000 # 采样率（Hz）每秒多少个采样点（帧）
  channels: 1 # 单声道
  chunk_duration_ms: 20  # 每次读取的音频块持续时间（毫秒）10,20,30
  # chunk_size: 960  # int(rate * chunk_duration_ms / 1000) * 2 # 每次读取的音频块大小（帧数）
  max_file_count: 20  # 最大保存音频文件数量，超过后循环覆盖
################################################

################# VAD 配置 ####################
VAD:
  output_dir: "output" # VAD 结果保存目录
  mode : 2 # 0：最宽松，允许更多非语音通过  1：平衡模式 2：较严格，减少非语音通过  3：最严格，过滤更多非语音
  no_speech_threshold: 0.6 # 静音持续多长时间后认为一句话结束 (秒)
  # reactive_kws_threshold: 100  # 重置唤醒词检测 激活 LLM 时间间隔 (秒) 
  decibel_threshold: -35 # 分贝阈值，低于此值认为是静音 (dB)
  min_recording_duration: 0.4 # 最短有效录音时长 (秒)
  max_recording_duration: 10 # 最大有效录音时长 (秒)
  pause_duration: 4 # 距离上次语音保存多长时间后，允许再次保存音频 (秒)
################################################

################# 唤醒词检测配置 #################
KWS:
  enable: false # 是否启用唤醒词检测
  failed_kws_counts : 1 # 连续未检测到唤醒词次数达到此值时，推送提示语音
  failed_kws_threshold: 30 # 连续未检测到唤醒词次数 达到 failed_kws_counts 后，推送提示语音的时间间隔 (秒)
  reactive_kws_threshold: 100 # 重置 需要唤醒词检测 激活 LLM 时间间隔 (秒) 
  wake_word: "你好小特"
  fuzzy_similarity_threshold: 0.78 # 唤醒词模糊匹配相似度阈值，范围0-1，值越大越严格
################################################

################ ROS 话题配置 ################
ros_cfg:
  asr_publish_topic: "asr_result" # 识别结果发布主题
  llm_publish_topic: "llm_result"   # LLM 回复结果发布主题
  response_publish_topic: "assistant_response" # 综合响应结果话题,同时包含ASR,LLM结果
  resolved_user_name_topic: "resolved_user_name" # 解析后的用户名称话题

  tts_active_topic: "sound_detected_default" # TTS 播放状态话题

  user_id_subscribe_topic: "user_id" # 用户ID订阅话题
  user_id_stale_timeout_sec: 5 # 用户ID过期时间，超过此时间未更新则认为用户离开，回退为 None (秒)

  enable_user_face_info: false # 是否启用用户人脸信息订阅功能，启用后会订阅 user_face_subscribe_topic 话题获取用户人脸状态
  user_face_subscribe_topic: "is_faced" # 用户人脸信息订阅话题 (bool:True 表示检测到人脸，False 表示未检测到人脸)
  user_face_stale_timeout_sec: 5 # 用户人脸信息过期时间，超过此时间未更新则认为用户离开，回退为 None (秒)
##############################################

enable_replace_special_characters: false # 是否启用替换特殊字符功能
enable_interrupt_tts: true # 是否启用打断 TTS 功能
energy_instability_check: false # 是否启用能量不稳定性检测
energy_frames: 50  # 能量窗口最大帧数 (内部使用)  50 x 0.1s = 5s
energy_instability_threshold: 2.5  # 能量不稳定性阈值，超过此值认为多人说话