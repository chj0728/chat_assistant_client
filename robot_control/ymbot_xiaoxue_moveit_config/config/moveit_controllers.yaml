# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    # - body_controller
    # - neck_controller
    #- left_arm_controller
    #- right_arm_controller
    # - left_body_arm_controller
    # - right_body_arm_controller
    # - body_neck_controller
    - upper_body_controller
    # - arms_controller

  # body_controller:
  #   type: FollowJointTrajectory
  #   joints:
  #     - Body_Joint1
  #     - Body_Joint2
  #   action_ns: follow_joint_trajectory
  #   default: true
  # neck_controller:
  #   type: FollowJointTrajectory
  #   joints:
  #     - Neck_Joint1
  #   action_ns: follow_joint_trajectory
  #   default: true
  left_arm_controller:
    type: FollowJointTrajectory
    joints:
      - Left_Arm_Joint1
      - Left_Arm_Joint2
      - Left_Arm_Joint3
      - Left_Arm_Joint4
      - Left_Arm_Joint5
    action_ns: follow_joint_trajectory
    default: true
  right_arm_controller:
    type: FollowJointTrajectory
    joints:
      - Right_Arm_Joint1
      - Right_Arm_Joint2
      - Right_Arm_Joint3
      - Right_Arm_Joint4
      - Right_Arm_Joint5
    action_ns: follow_joint_trajectory
    default: true
  # left_body_arm_controller:
  #   type: FollowJointTrajectory
  #   joints:
  #     - Body_Joint1
  #     - Body_Joint2
  #     - Left_Arm_Joint1
  #     - Left_Arm_Joint2
  #     - Left_Arm_Joint3
  #     - Left_Arm_Joint4
  #     - Left_Arm_Joint5
  #   action_ns: follow_joint_trajectory
  #   default: true
  # right_body_arm_controller:
  #   type: FollowJointTrajectory
  #   joints:
  #     - Body_Joint1
  #     - Body_Joint2
  #     - Right_Arm_Joint1
  #     - Right_Arm_Joint2
  #     - Right_Arm_Joint3
  #     - Right_Arm_Joint4
  #     - Right_Arm_Joint5
  #   action_ns: follow_joint_trajectory
  #   default: true
  body_neck_controller:
    type: FollowJointTrajectory
    joints:
      - Body_Joint1
      - Body_Joint2
      - Neck_Joint1
    action_ns: follow_joint_trajectory
    default: true

  upper_body_controller:
    type: FollowJointTrajectory
    joints:
      - Neck_Joint1
      - Neck_Joint2
      - Body_Joint1
      - Body_Joint2
      - Left_Arm_Joint1
      - Left_Arm_Joint2
      - Left_Arm_Joint3
      - Left_Arm_Joint4
      - Left_Arm_Joint5
      - Right_Arm_Joint1
      - Right_Arm_Joint2
      - Right_Arm_Joint3
      - Right_Arm_Joint4
      - Right_Arm_Joint5
    action_ns: follow_joint_trajectory
    default: true

  # arms_controller:
  #   type: FollowJointTrajectory
  #   joints:
  #     - Left_Arm_Joint1
  #     - Left_Arm_Joint2
  #     - Left_Arm_Joint3
  #     - Left_Arm_Joint4
  #     - Left_Arm_Joint5
  #     - Right_Arm_Joint1
  #     - Right_Arm_Joint2
  #     - Right_Arm_Joint3
  #     - Right_Arm_Joint4
  #     - Right_Arm_Joint5
  #   action_ns: follow_joint_trajectory
  #   default: true